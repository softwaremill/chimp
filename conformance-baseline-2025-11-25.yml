server:
  # needs main-code feature: server-to-client requests during tools/call
  - tools-call-elicitation
  - elicitation-sep1034-defaults
  - elicitation-sep1330-enums
  # sampling is deprecated in spec 2026-07-28
  - tools-call-sampling
  # needs main-code feature: Mcp-Session-Id sessions; without a session id the
  # scenario stops early with a warning, which the baseline counts as a failure
  - server-sse-multiple-streams
client:
  # needs main-code feature: SSE resumability; feature removed in spec 2026-07-28
  - sse-retry
  # needs main-code feature: full OAuth client
  - auth/metadata-default
  - auth/metadata-var1
  - auth/metadata-var2
  - auth/metadata-var3
  - auth/basic-cimd
  - auth/scope-from-www-authenticate
  - auth/scope-from-scopes-supported
  - auth/scope-omitted-when-undefined
  - auth/scope-step-up
  - auth/scope-retry-limit
  - auth/token-endpoint-auth-basic
  - auth/token-endpoint-auth-post
  - auth/token-endpoint-auth-none
  - auth/pre-registration
